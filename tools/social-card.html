<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>LifeSim · Social card</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f4ee;
        color: #283d34;
        width: 1200px;
        height: 630px;
        font-family: "DM Sans", sans-serif;
        display: flex;
        align-items: center;
        padding: 60px;
        gap: 40px;
      }
      .copy {
        width: 510px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font:
          36px "Outfit",
          sans-serif;
        margin-bottom: 42px;
      }
      .brand img {
        width: 42px;
        height: 42px;
      }
      h1 {
        font:
          58px/1.05 "Outfit",
          sans-serif;
        letter-spacing: -2px;
        margin: 0 0 25px;
      }
      em {
        font-family: Georgia, serif;
        font-weight: 400;
        color: #668568;
      }
      .copy > p {
        font-size: 19px;
        color: #64735c;
        line-height: 1.7;
        max-width: 410px;
      }
      .link {
        margin-top: 30px;
        color: #3b5c43;
        letter-spacing: 2px;
        font-size: 13px;
      }
      .world {
        width: 470px;
        height: 510px;
        flex-shrink: 0;
        border-radius: 170px 170px 25px 25px;
        background: url("../assets/backgrounds/neighborhood.webp") center/cover;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 53px;
        gap: 5px;
        box-shadow: inset 0 0 0 5px #ffffff55;
      }
      .world img {
        height: 255px;
        filter: drop-shadow(0 8px 4px #1e352d55);
      }
      .world img + img {
        height: 250px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../favicon.svg" alt="" />LifeSim</div>
      <h1>Una vida.<br />Mil <em>posibilidades.</em></h1>
      <p>Tu vida, tus decisiones.<br />Escribe una historia irrepetible.</p>
      <div class="link">LIFESIM.DPDNS.ORG · JUEGA GRATIS</div>
    </div>
    <div class="world">
      <img src="../assets/characters/0-young.webp" alt="" /><img
        src="../assets/characters/1-young.webp"
        alt=""
      />
    </div>
  </body>
</html>
