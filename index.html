<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090f1c" />
    <meta name="color-scheme" content="dark" />
    <title>LifeSim — Una vida. Mil posibilidades.</title>
    <meta
      name="description"
      content="Tu vida, tus decisiones. Construye una historia única en LifeSim: estudia, enamórate, encuentra tu vocación y descubre hasta dónde te lleva cada elección. Juega gratis."
    />
    <link rel="canonical" href="https://lifesim.dpdns.org/" />
    <meta
      property="og:title"
      content="LifeSim — Una vida. Mil posibilidades."
    />
    <meta
      property="og:description"
      content="Un pequeño mundo. Una historia irrepetible. Tu próxima vida empieza aquí."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lifesim.dpdns.org/" />
    <meta
      property="og:image"
      content="https://lifesim.dpdns.org/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="LifeSim — Una vida. Mil posibilidades."
    />
    <meta
      name="twitter:description"
      content="Tu vida, tus decisiones. Juega gratis y escribe tu propia historia."
    />
    <meta
      name="twitter:image"
      content="https://lifesim.dpdns.org/og-image.png"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="modulepreload" href="js/ui.js" />

  <body>
    <a href="#main" class="skip-link">Ir al juego</a>
    <div id="app"></div>
    <div
      id="announcer"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="toasts" class="toasts" aria-hidden="true"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript
      ><main>
        <h1>LifeSim</h1>
        <p>Activa JavaScript en tu navegador para empezar tu vida.</p>
      </main></noscript
    >
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
