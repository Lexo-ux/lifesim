name: Game quality
on:
  push:
    branches:
      [main, lifesim-2.0, lifesim-v3-card-first, "codex/**", "foundation/**"]
  pull_request:
permissions:
  contents: read
jobs:
  game-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: output/qa/
